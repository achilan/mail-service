name: CI
on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo puede leer el código.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
